name: Build unsigned IPA

# Builds Mirage on a macOS runner and uploads an unsigned .ipa you can sign
# locally with Sideloadly. Nothing here needs a Mac of your own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you hit "Run workflow" by hand from the Actions tab

env:
  # Pinned deliberately. Bump it on purpose, not implicitly — DeviceLink.swift's FFI
  # calls have to match this version's idevice.h.
  IDEVICE_VERSION: v0.1.68

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # 203 MB per release, so don't re-download it on every push.
      - name: Cache idevice xcframework
        id: cache-idevice
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-${{ env.IDEVICE_VERSION }}

      # Upstream can't be used as a SwiftPM dependency (its Package.swift is in a
      # subdirectory), so take the prebuilt xcframework they publish per release.
      - name: Download idevice xcframework
        if: steps.cache-idevice.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Vendor/idevice /tmp/ideviceraw
          gh release download "$IDEVICE_VERSION" \
            --repo jkcoxson/idevice \
            --pattern 'idevice-xcframework-*.zip' \
            --output /tmp/idevice.zip
          unzip -q /tmp/idevice.zip -d /tmp/ideviceraw
          # The zip's internal layout isn't contractual, so hoist any xcframework
          # out of wherever it landed.
          find /tmp/ideviceraw -maxdepth 4 -type d -name '*.xcframework' \
            -exec cp -R {} Vendor/idevice/ \;

      # Diagnostic, not a gate: upstream ships only IDevice.xcframework, so the open
      # question is whether the generated idevice.h also declares the libplist types
      # DeviceLink.swift needs. This prints the answer either way.
      - name: Inspect the dependency
        run: |
          echo "--- xcframeworks present ---"
          ls -1 Vendor/idevice || true
          echo "--- ios-arm64 slice ---"
          find Vendor/idevice/IDevice.xcframework/ios-arm64 -maxdepth 2 | sed 's/^/    /'
          echo "--- modulemap ---"
          find Vendor/idevice -name 'module.modulemap' -exec cat {} \;
          echo "--- every plist-ish identifier in idevice.h ---"
          HDR=$(find Vendor/idevice -name 'idevice.h' | head -1)
          echo "header: $HDR"
          grep -oE '[A-Za-z_][A-Za-z0-9_]*plist[A-Za-z0-9_]*' "$HDR" | sort -u | sed 's/^/    /'
          echo "--- symbols DeviceLink.swift calls, present/absent ---"
          for sym in plist_free plist_get_uint_val idevice_plist_array_free \
                     location_simulation_new tunnel_create_rppairing \
                     image_mounter_mount_personalized_rsd cryptexd_install_ddi \
                     lockdownd_get_value rp_pairing_file_read; do
            if grep -q "\b$sym\b" "$HDR"; then echo "    OK      $sym"; else echo "    MISSING $sym"; fi
          done
          echo "--- minimum iOS of the device slice ---"
          vtool -show-build-version \
            Vendor/idevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a 2>/dev/null \
            | grep -E 'platform|minos' || echo "    (could not read build version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Mirage.xcodeproj
        run: xcodegen generate

      # Unsigned: CI has no certificate and doesn't need one. Sideloadly signs
      # the result with your Apple ID when you install it.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Mirage.xcodeproj \
            -scheme Mirage \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package into .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Mirage.app"
          if [ ! -d "$APP" ]; then
            echo "::error::No Mirage.app was produced — see the Build step above."
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Mirage.ipa Payload
          ls -lh Mirage.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-unsigned
          path: Mirage.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
