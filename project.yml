# XcodeGen spec. Text-based on purpose: you're authoring on Windows, and a .xcodeproj
# can't be hand-edited safely. CI runs `xcodegen generate` to produce Mirage.xcodeproj.

name: Mirage

options:
  bundleIdPrefix: com.hertj
  deploymentTarget:
    iOS: "17.0" # matches IPHONEOS_DEPLOYMENT_TARGET=17.0 in idevice's own apple-build recipe
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DeviceLink is @unchecked Sendable behind a serial queue; targeted keeps the
    # warnings useful instead of burying them.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# idevice is NOT consumable as a SwiftPM dependency: its Package.swift lives in the repo's
# swift/ subdirectory, and SwiftPM requires one at the root. Upstream publishes a prebuilt
# idevice-xcframework-<ver>.zip per release instead, which CI downloads before generating
# this project. See Vendor/idevice/README.md.

targets:
  Mirage:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Support/Info.plist
    entitlements:
      path: App/Support/Mirage.entitlements
    dependencies:
      # Both wrap static archives, so there is nothing to embed in the bundle.
      - framework: Vendor/idevice/IDevice.xcframework
        embed: false
      - framework: Vendor/idevice/plist.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hertj.mirage
        INFOPLIST_FILE: App/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Support/Mirage.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
