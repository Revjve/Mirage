# XcodeGen spec. Text-based on purpose: you're authoring on Windows, and a .xcodeproj
# can't be hand-edited safely. CI runs `xcodegen generate` to produce Mirage.xcodeproj.

name: Mirage

options:
  bundleIdPrefix: com.hertj
  deploymentTarget:
    iOS: "17.0" # MapReader / MapPolyline / ContentUnavailableView are all 17+
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DeviceLink is @unchecked Sendable behind a serial queue; targeted keeps the
    # warnings useful instead of burying them.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# No `packages:` block. idevice does NOT ship as a SwiftPM package — StikJIT bundles it
# as a prebuilt static archive (libidevice_ffi.a) plus idevice.h and a module map, which
# is what `import idevice` in DeviceLink.swift resolves against. See Vendor/idevice/README.md.

targets:
  Mirage:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Vendor/idevice
        buildPhase: none # headers + modulemap + .a — nothing for the Swift compiler to build
    info:
      path: App/Support/Info.plist
    entitlements:
      path: App/Support/Mirage.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hertj.mirage
        INFOPLIST_FILE: App/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Support/Mirage.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        # How `import idevice` is found, and how the archive gets linked.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/idevice
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/idevice
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/idevice
        OTHER_LDFLAGS: -lidevice_ffi
